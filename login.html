<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Hansen Firm - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f0f;
            color: #ddd;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #00ff88;
            font-size: 28px;
            text-shadow: 0 0 8px #00ff88;   /* Single soft glow - no blur */
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #00ff88;
            animation: typewriter 3.2s steps(32, end) forwards,
                       blink-caret 0.75s step-end infinite;
        }

        @keyframes typewriter {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #00ff88; }
        }

        label { 
            display: block; 
            margin: 15px 0 6px; 
            color: #ccc; 
        }

        .input-group {
            position: relative;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.15);
            outline: none;
        }

        /* Clean hover for both fields */
        input:hover {
            border-color: #666;
        }

        /* Password field specific - no green blob */
        #password:hover {
            border-color: #666;
            box-shadow: none;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            z-index: 10;
        }

        .toggle-password:hover {
            color: #00ff88;
        }

        .error-message {
            color: #ff6666;
            font-size: 0.9em;
            margin-top: 4px;
            min-height: 20px;
        }

        .general-error {
            color: #ff6666;
            background: rgba(255, 102, 102, 0.1);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin: 15px 0;
            display: none;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 20px;
            font-size: 0.95em;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
        }

        .forgot-link {
            color: #00ff88;
            text-decoration: none;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) { 
            background: #33ffaa; 
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link { 
            text-align: center; 
            margin-top: 25px; 
        }
        
        .back-link a { 
            color: #888; 
            text-decoration: none; 
        }
        .back-link a:hover { color: #ddd; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to Mr. Hansen Firm</h2>
      
        <form id="loginForm" autocomplete="off">
            <label for="email">Email</label>
            <div class="input-group">
                <input type="email" id="email" autocomplete="off" placeholder="your@email.com">
            </div>
            <div id="emailError" class="error-message"></div>

            <label for="password">Password</label>
            <div class="input-group">
                <input type="password" id="password" autocomplete="new-password" placeholder="Enter password">
                <button type="button" class="toggle-password" id="togglePassword">👁</button>
            </div>
            <div id="passwordError" class="error-message"></div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <div id="generalError" class="general-error"></div>

            <button type="submit" id="loginButton">
                Sign In
            </button>
        </form>

        <div class="back-link">
            <a href="index.html">← Back to Main Site</a>
        </div>
    </div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

function showError(fieldId, message) {
    const errorDiv = document.getElementById(fieldId + 'Error');
    if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    }
}

function showGeneralError(message) {
    const errorDiv = document.getElementById('generalError');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
}

function clearErrors() {
    document.querySelectorAll('.error-message').forEach(el => {
        el.style.display = 'none';
        el.textContent = '';
    });
    document.getElementById('generalError').style.display = 'none';
}

function setLoading(isLoading) {
    const button = document.getElementById('loginButton');
    if (isLoading) {
        button.disabled = true;
        button.innerHTML = `<span class="spinner"></span> Signing in...`;
    } else {
        button.disabled = false;
        button.textContent = 'Sign In';
    }
}

function loadRememberedEmail() {
    const savedEmail = localStorage.getItem('rememberedEmail');
    if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
    }
}

function handleRememberMe(email) {
    if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('rememberedEmail', email);
    } else {
        localStorage.removeItem('rememberedEmail');
    }
}

async function loginUser(email, password) {
    try {
        const formData = new FormData();
        formData.append("action", "loginUser");
        formData.append("email", email);
        formData.append("password", password);

        const res = await fetch(BASE_URL, { method: "POST", body: formData });
        const data = await res.json();

        if (!data.success) {
            showGeneralError(data.error || "Invalid email or password.");
            return;
        }

        handleRememberMe(email);

        const role = data.role;
        if (role === "firm_admin") window.location.href = "firm-admin.html";
        else if (role === "associate") window.location.href = `associate-admin.html?id=${encodeURIComponent(data.associateId || '')}`;
        else if (role === "client" || role === "client_admin") window.location.href = "client-admin.html";
        else if (role === "community_user") window.location.href = "community.html";
        else showGeneralError("Your account role is not properly configured.");
    } catch (err) {
        console.error(err);
        showGeneralError("Connection error. Please check your internet and try again.");
    }
}

// Password toggle
document.getElementById('togglePassword').addEventListener('click', function() {
    const pw = document.getElementById('password');
    if (pw.type === 'password') {
        pw.type = 'text';
        this.textContent = '🙈';
    } else {
        pw.type = 'password';
        this.textContent = '👁';
    }
});

// Form submit
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email) return showError('email', 'Please enter your email');
    if (!password) return showError('password', 'Please enter your password');

    setLoading(true);
    await loginUser(email, password);
    setLoading(false);
});

window.addEventListener('load', loadRememberedEmail);
</script>
</body>
</html>
