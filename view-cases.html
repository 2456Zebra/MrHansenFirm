<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Cases - MR. HANSEN FIRM</title>
  <style>
    :root {
      --green: #00ff88;
      --dark: #0a0a0a;
      --gray: #1a1a1a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #ddd;
      line-height: 1.5;
    }
    .header {
      background: var(--dark);
      padding: 15px 30px;
      border-bottom: 2px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { color: var(--green); font-size: 24px; font-weight: bold; }
    .main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .case-card {
      background: var(--gray);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
      transition: all 0.2s;
      display: flex;
      gap: 20px;
    }
    .case-card:hover {
      border-color: var(--green);
      transform: translateY(-2px);
    }
    .case-left {
      flex: 1;
    }
    .case-title {
      font-size: 18px;
      color: var(--green);
      margin-bottom: 8px;
    }
    .case-meta {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .case-desc {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .case-stats {
      display: flex;
      gap: 25px;
      font-size: 13px;
    }
    .case-stats span {
      color: #aaa;
    }
    .notification {
      color: var(--green);
      font-weight: bold;
    }
    .pink { color: #ff66aa; font-weight: bold; }
    .btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-small {
      padding: 5px 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">MR. HANSEN FIRM</div>
  <div>
    <button onclick="showSignup()" class="btn">Join Community / Become Associate</button>
  </div>
</div>

<div class="main">
  <h1 style="color:var(--green); margin-bottom:25px;">Active Cases</h1>
  
  <div id="casesList"></div>
</div>

<!-- Case Detail Modal -->
<div id="caseModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; overflow-y:auto;">
  <div style="max-width:900px; margin:40px auto; background:#111; padding:30px; border:2px solid var(--green); border-radius:10px;">
    <button onclick="closeModal()" style="float:right; background:none; border:none; color:var(--green); font-size:28px; cursor:pointer;">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

async function loadCases() {
  try {
    const res = await fetch(BASE_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getCases" })
    });
    const data = await res.json();

    const container = document.getElementById('casesList');
    container.innerHTML = '';

    if (data.cases) {
      data.cases.forEach(c => {
        const card = document.createElement('div');
        card.className = 'case-card';
        card.innerHTML = `
          <div class="case-left">
            <div class="case-title">${c.title}</div>
            <div class="case-meta">${new Date(c.timestamp).toLocaleDateString()} • ${c.associateName || 'Unassigned'}</div>
            <div class="case-desc">${(c.description || '').substring(0, 160)}...</div>
            <div class="case-stats">
              <span>💬 ${Math.floor(Math.random()*12)+3} comments</span>
              <span>👍 ${Math.floor(Math.random()*25)+5}</span>
              <span class="notification">+12 new</span>
            </div>
          </div>
          <div>
            <button onclick="openCase(${JSON.stringify(c).replace(/"/g, '&quot;')})" class="btn btn-small">View Full Case</button>
          </div>
        `;
        container.appendChild(card);
      });
    }
  } catch(e) {
    console.error(e);
  }
}

function openCase(c) {
  const modal = document.getElementById('caseModal');
  const content = document.getElementById('modalContent');
  
  content.innerHTML = `
    <h2 style="color:var(--green); margin-bottom:15px;">${c.title}</h2>
    <p><strong>Posted:</strong> ${new Date(c.timestamp).toLocaleString()} • <strong>By:</strong> ${c.clientName}</p>
    <p><strong>Associate:</strong> ${c.associateName || 'Unassigned'}</p>
    <hr style="border-color:#333; margin:20px 0;">
    <p style="line-height:1.6;">${c.description}</p>
    
    <h3 style="color:var(--green); margin:30px 0 15px;">Comments &amp; Interaction</h3>
    <div style="background:#0a0a0a; padding:20px; border-radius:8px; margin-bottom:20px;">
      <p><strong>@ProblemSolver:</strong> This is a classic case of cognitive dissonance. I can help unpack it.</p>
      <p style="margin-top:12px; color:#888;">👍 12 &nbsp; 👎 2</p>
    </div>
    
    <textarea placeholder="Add your comment..." style="width:100%; height:90px; background:#222; border:1px solid #444; color:#ddd; padding:12px; margin-bottom:10px;"></textarea>
    <button onclick="alert('Comment posted! (Live demo)')" class="btn">Post Comment</button>
  `;
  modal.style.display = 'block';
}

function closeModal() {
  document.getElementById('caseModal').style.display = 'none';
}

function showSignup() {
  alert("Community / Associate Signup coming soon!");
}

// Load on start
loadCases();
</script>
</body>
</html>
