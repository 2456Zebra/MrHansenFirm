<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Hansen - Cases</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body { background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; }

    .neon-clean { color: #00ff9d; }

    .post-card { transition: all 0.18s ease; }
    .post-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(0, 255, 157, 0.12);
      border-color: #00ff9d;
    }

    .compact-card { padding: 10px 14px; }

    .category-pill.active {
      background: linear-gradient(135deg, #22c55e, #a3e635);
      color: #020617;
      font-weight: 600;
    }

    .category-pill {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sticky-badge {
      background: #facc15;
      color: #1f2933;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      box-shadow: 0 0 6px rgba(250, 204, 21, 0.7);
      display: inline-block;
      margin-bottom: 4px;
    }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-200 min-h-screen pb-12">

  <div class="max-w-4xl mx-auto px-4 pt-6">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-6 border-b border-zinc-800 pb-4">
  <div>
    <h1 class="text-4xl font-extrabold tracking-tight neon-clean">Mr.  Hansen</h1>
    <p class="text-emerald-400 text-sm mt-1">We Solve Problems!</p>
  </div>

  <!-- SPINNER -->
  <div id="headerSpinner" class="flex items-center justify-center">
    <div class="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
  </div>
</div>


      <a href="/index.html" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300 text-sm font-medium">
        <span class="text-lg">←</span> Back To Home
      </a>
    </div>

    <!-- CATEGORY BUTTONS -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="filterCategory(this, 'latest')" class="category-pill active px-4 py-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700">Latest</button>
      <button onclick="filterCategory(this, 'popular')" class="category-pill px-4 py-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700">Most Popular</button>

      <button onclick="filterCategory(this, 'relationships')" class="category-pill px-4 py-1.5 rounded-full bg-fuchsia-700/70 hover:bg-fuchsia-600/80">Relationships</button>
      <button onclick="filterCategory(this, 'family')" class="category-pill px-4 py-1.5 rounded-full bg-sky-700/70 hover:bg-sky-600/80">Family</button>
      <button onclick="filterCategory(this, 'fitness')" class="category-pill px-4 py-1.5 rounded-full bg-emerald-700/70 hover:bg-emerald-600/80">Fitness</button>
      <button onclick="filterCategory(this, 'health')" class="category-pill px-4 py-1.5 rounded-full bg-rose-700/70 hover:bg-rose-600/80">Health</button>
      <button onclick="filterCategory(this, 'work')" class="category-pill px-4 py-1.5 rounded-full bg-indigo-700/70 hover:bg-indigo-600/80">Work</button>
      <button onclick="filterCategory(this, 'money')" class="category-pill px-4 py-1.5 rounded-full bg-amber-700/70 hover:bg-amber-600/80">Money</button>
      <button onclick="filterCategory(this, 'legal')" class="category-pill px-4 py-1.5 rounded-full bg-lime-700/70 hover:bg-lime-600/80">Legal</button>
      <button onclick="filterCategory(this, 'travel')" class="category-pill px-4 py-1.5 rounded-full bg-cyan-700/70 hover:bg-cyan-600/80">Travel</button>
      <button onclick="filterCategory(this, 'spiritual')" class="category-pill px-4 py-1.5 rounded-full bg-purple-700/70 hover:bg-purple-600/80">Spiritual</button>
      <button onclick="filterCategory(this, 'other')" class="category-pill px-4 py-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700">Other</button>
    </div>

    <!-- CASE LIST -->
    <div class="space-y-2" id="posts-container"></div>
  </div>

  <script>
    let allCases = [];
    let currentCategory = "latest";

    function sortCases(cases, category) {
      let sorted = [...cases];

      if (category === "latest") {
        sorted.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      } else if (category === "popular") {
        const getComments = p => (p.commentsCount ?? p.commentCount ?? 0);
        sorted.sort((a, b) => getComments(b) - getComments(a));
      } else {
        sorted = sorted.filter(c => (c.category || "other") === category);
      }

      sorted.sort((a, b) => (b.featured === true) - (a.featured === true));
      return sorted;
    }

    function renderCases(cases) {
      allCases = cases || [];
      const container = document.getElementById("posts-container");
      container.innerHTML = "";

      if (!allCases.length) {
        container.innerHTML = `<p class="text-zinc-500 text-sm">No cases available.</p>`;
        return;
      }

      const visible = sortCases(allCases, currentCategory);

      visible.forEach(post => {
        const div = document.createElement("div");
        div.className = "post-card compact-card bg-zinc-900 border border-zinc-800 rounded-xl flex items-start gap-3 cursor-pointer";

        div.onclick = () => {
          window.location.href = "forum.html?id=" + post.id;
        };

        const displayName = post.clientDisplayName || post.clientName || "Client";
        const ts = post.timestamp ? new Date(post.timestamp).toLocaleString() : "";
        const comments = post.commentsCount ?? post.commentCount ?? 0;
        const assocName = post.associateName || "Assigned Associate";

        div.innerHTML = `
          <div class="flex-1 leading-tight">
            ${post.featured ? `<span class="sticky-badge">Featured</span>` : ""}
            <h2 class="text-[18px] font-extrabold leading-snug underline decoration-emerald-400 underline-offset-4 neon-clean">
              ${post.title}
            </h2>
            <p class="text-[11px] text-zinc-400 mt-0.5">
              ${displayName} • ${ts} • ${post.tier || ""} • Associate: ${assocName}
            </p>
          </div>

          <div class="text-right min-w-[60px]">
            <div class="text-[10px] uppercase tracking-widest text-zinc-500">Comments</div>
            <div class="neon-clean text-2xl font-bold leading-none">${comments}</div>
          </div>
        `;

        container.appendChild(div);
      });
    }

    function filterCategory(btn, category) {
      document.querySelectorAll(".category-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = category;
      renderCases(allCases);
    }

    window.onload = () => {
      fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getPublicCases")
        .then(r => r.json())
        .then(data => {
          console.log("Loaded cases:", data);
          // backend returns { success: true, cases: [...] }
          renderCases(data.cases || []);
        })
        .catch(err => {
          console.error("Error loading cases:", err);
          document.getElementById("posts-container").innerHTML =
            `<p class="text-red-400 text-sm">Error loading cases.</p>`;
        });
    };
  </script>

</body>
</html>
