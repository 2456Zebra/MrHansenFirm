<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Cases - MR. HANSEN FIRM</title>
  <style>
    :root {
      --green: #00ff88;
      --dark: #0a0a0a;
      --gray: #1a1a1a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #ddd;
      min-height: 100vh;
    }
    .header {
      background: var(--dark);
      padding: 20px 40px;
      border-bottom: 2px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { color: var(--green); font-size: 26px; font-weight: bold; }
    .main {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .case-card {
      background: var(--gray);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      transition: all 0.3s;
    }
    .case-card:hover {
      border-color: var(--green);
      transform: translateY(-3px);
    }
    .case-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .case-title {
      font-size: 20px;
      color: var(--green);
    }
    .meta {
      color: #888;
      font-size: 14px;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin: 15px 0;
      color: #aaa;
    }
    .btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .notification {
      color: var(--green);
      font-weight: bold;
    }
    .pink { color: #ff66aa; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">MR. HANSEN FIRM</div>
  <div>
    <button onclick="showSignup()" class="btn">Join Community</button>
  </div>
</div>

<div class="main">
  <h1 style="color:var(--green); margin-bottom:30px;">Active Cases</h1>
  
  <div id="casesList"></div>
</div>

<!-- Case Detail Modal -->
<div id="caseModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; overflow-y:auto;">
  <div style="max-width:900px; margin:40px auto; background:#111; padding:30px; border:2px solid var(--green);">
    <button onclick="closeModal()" style="float:right; background:none; border:none; color:var(--green); font-size:24px;">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

async function loadCases() {
  try {
    const res = await fetch(BASE_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getCases" })
    });
    const data = await res.json();

    const container = document.getElementById('casesList');
    container.innerHTML = '';

    if (data.cases) {
      data.cases.forEach(c => {
        const card = document.createElement('div');
        card.className = 'case-card';
        card.innerHTML = `
          <div class="case-header">
            <div class="case-title">${c.title}</div>
            <div class="meta">${new Date(c.timestamp).toLocaleDateString()}</div>
          </div>
          <p>${(c.description || '').substring(0, 140)}...</p>
          <div class="stats">
            <span>👤 ${c.associateName || 'Unassigned'}</span>
            <span>💬 ${Math.floor(Math.random()*15)} comments</span>
            <span>👍 ${Math.floor(Math.random()*28)}</span>
            <span class="notification">+12 new</span>
          </div>
          <button onclick="openCase(${JSON.stringify(c).replace(/"/g, '&quot;')})" class="btn">View Full Case</button>
        `;
        container.appendChild(card);
      });
    }
  } catch(e) {
    console.error(e);
  }
}

function openCase(c) {
  const modal = document.getElementById('caseModal');
  const content = document.getElementById('modalContent');
  
  content.innerHTML = `
    <h2 style="color:var(--green);">${c.title}</h2>
    <p><strong>By:</strong> ${c.clientName} • ${new Date(c.timestamp).toLocaleString()}</p>
    <p><strong>Associate:</strong> ${c.associateName || 'Unassigned'}</p>
    <hr style="border-color:#333; margin:20px 0;">
    <p>${c.description}</p>
    
    <h3 style="color:var(--green); margin:25px 0 15px;">Comments</h3>
    <div style="background:#0a0a0a; padding:15px; border-radius:8px;">
      <p><strong>@ProblemSolver:</strong> This looks like a deep behavioral pattern. I can help break it down.</p>
      <p style="margin-top:12px; color:#888;">👍 7 &nbsp; 👎 1</p>
    </div>
    
    <textarea placeholder="Write a comment..." style="width:100%; height:80px; background:#222; border:1px solid #444; color:#ddd; margin-top:20px; padding:12px;"></textarea>
    <button onclick="alert('Comment posted! (Demo)')" class="btn" style="margin-top:10px;">Post Comment</button>
  `;
  
  modal.style.display = 'block';
}

function closeModal() {
  document.getElementById('caseModal').style.display = 'none';
}

function showSignup() {
  alert("Signup modal coming soon!\n\nOptions: Join as Community User or Apply as Associate");
}

// Load cases on page load
loadCases();
</script>
</body>
</html>
