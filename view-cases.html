<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Cases | MR. HANSEN FIRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ——— ALL YOUR CSS EXACTLY AS PROVIDED ——— */
    /* (I am not repeating it here in chat to avoid a 40,000‑character wall) */
    /* But in your final file, the CSS stays EXACTLY as you sent it. */
  </style>
</head>

<body>
  <div class="page-shell">
    <!-- ——— YOUR HEADER, FEED PANEL, SIDEBAR ——— -->
    <!-- (All HTML stays EXACTLY as you provided it) -->

    <script>
      /****************************************************
       * REAL-TIME BACKEND URL
       ****************************************************/
      const BACKEND_URL =
        "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

      /****************************************************
       * UNIVERSAL BACKEND CALLER (POST ONLY)
       ****************************************************/
      async function backend(action, payload = {}) {
        try {
          const res = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action, ...payload })
          });

          const data = await res.json();
          if (!data.success) {
            console.error("Backend error:", data.error);
            return null;
          }
          return data;
        } catch (err) {
          console.error("Fetch error:", err);
          return null;
        }
      }

      /****************************************************
       * DOM ELEMENTS
       ****************************************************/
      const casesFeed = document.getElementById("casesFeed");
      const emptyState = document.getElementById("emptyState");

      const filterTier = document.getElementById("filterTier");
      const filterStatus = document.getElementById("filterStatus");
      const filterAssociate = document.getElementById("filterAssociate");
      const applyFilters = document.getElementById("applyFilters");

      const filtersToggle = document.getElementById("filtersToggle");
      const filtersPanel = document.getElementById("filtersPanel");

      const trendingCasesEl = document.getElementById("trendingCases");
      const topAssociatesEl = document.getElementById("topAssociates");
      const recentCommentsEl = document.getElementById("recentComments");

      const chips = document.querySelectorAll(".chip");

      let allCases = [];

      /****************************************************
       * FILTER PANEL TOGGLE
       ****************************************************/
      filtersToggle.addEventListener("click", () => {
        filtersPanel.classList.toggle("open");
      });

      /****************************************************
       * INLINE STATUS CHIPS
       ****************************************************/
      chips.forEach(chip => {
        chip.addEventListener("click", () => {
          chips.forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          const status = chip.getAttribute("data-filter");
          applyStatusChipFilter(status);
        });
      });

      function applyStatusChipFilter(status) {
        const filtered = allCases.filter(c => {
          if (status === "all") return true;
          return (c.status || "").toLowerCase() === status;
        });
        renderCases(filtered);
      }

      /****************************************************
       * LOAD CASES (FETCH VERSION)
       ****************************************************/
      async function loadCases() {
        const data = await backend("getCases");

        if (!data || !Array.isArray(data.cases) || data.cases.length === 0) {
          emptyState.style.display = "flex";
          return;
        }

        allCases = data.cases;
        emptyState.style.display = "none";

        renderCases(allCases);
        populateAssociates(allCases);
        buildSidebar(allCases);
      }

      /****************************************************
       * POPULATE ASSOCIATE FILTER DROPDOWN
       ****************************************************/
      function populateAssociates(cases) {
        const associates = new Set();
        cases.forEach(c => {
          if (c.associateName && c.associateName.trim() !== "") {
            associates.add(c.associateName.trim());
          }
        });

        filterAssociate.innerHTML = `<option value="all">All</option>`;
        [...associates].forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          filterAssociate.appendChild(opt);
        });
      }

      /****************************************************
       * APPLY FILTERS BUTTON
       ****************************************************/
      function applyCaseFilters() {
        const tier = filterTier.value;
        const status = filterStatus.value;
        const associate = filterAssociate.value;

        const filtered = allCases.filter(c => {
          const tierMatch =
            tier === "all" ||
            (c.tier || "").toLowerCase() === tier.toLowerCase();

          const statusMatch =
            status === "all" ||
            (c.status || "").toLowerCase() === status.toLowerCase();

          const associateMatch =
            associate === "all" ||
            (c.associateName || "") === associate;

          return tierMatch && statusMatch && associateMatch;
        });

        renderCases(filtered);
      }

      applyFilters.addEventListener("click", applyCaseFilters);

      /****************************************************
       * AVATAR BUILDER
       ****************************************************/
      function createAvatarElement(caseObj) {
        const avatar = document.createElement("div");
        avatar.className = "avatar";

        const photoUrl = caseObj.photoUrl || "";
        if (photoUrl) {
          const img = document.createElement("img");
          img.src = photoUrl;
          img.alt = caseObj.associateName || "Associate";
          avatar.appendChild(img);
        } else {
          const name = caseObj.associateName || "User";
          const initials = name
            .split(" ")
            .map(part => part[0])
            .join("")
            .slice(0, 2)
            .toUpperCase();
          avatar.textContent = initials;
        }

        return avatar;
      }

      /****************************************************
       * RENDER CASE FEED
       ****************************************************/
      function renderCases(cases) {
        casesFeed.innerHTML = "";

        if (cases.length === 0) {
          casesFeed.innerHTML = `
            <div class="empty-state">
              <strong>No cases match your filters.</strong>
              <span class="hint">Try adjusting your filter selections.</span>
            </div>
          `;
          return;
        }

        cases.forEach(c => {
          const post = document.createElement("article");
          post.className = "case-post";

          const avatarWrapper = document.createElement("div");
          avatarWrapper.className = "avatar-wrapper";
          avatarWrapper.appendChild(createAvatarElement(c));

          const main = document.createElement("div");
          main.className = "post-main";

          /* ——— HEADER ——— */
          const header = document.createElement("div");
          header.className = "post-header";

          const metaLeft = document.createElement("div");
          metaLeft.className = "post-meta-left";

          const authorRow = document.createElement("div");
          authorRow.className = "post-author-row";

          const displayName = document.createElement("span");
          displayName.className = "post-display-name";
          displayName.textContent = c.clientDisplayName || "Client";

          const handle = document.createElement("span");
          handle.className = "post-handle";
          handle.textContent = "@" + (c.associateName || "associate").replace(/\s+/g, "").toLowerCase();

          authorRow.appendChild(displayName);
          authorRow.appendChild(handle);

          const timestamp = document.createElement("div");
          timestamp.className = "post-timestamp";
          timestamp.textContent = c.timestamp || "";

          metaLeft.appendChild(authorRow);
          metaLeft.appendChild(timestamp);

          const metaRight = document.createElement("div");
          metaRight.className = "post-meta-right";

          const tierTag = document.createElement("span");
          tierTag.className = "tag tag-tier";
          tierTag.textContent = c.tier || "Tier";

          const statusTag = document.createElement("span");
          const status = (c.status || "").toLowerCase();
          statusTag.className =
            "tag " +
            (status === "open"
              ? "tag-status-open"
              : status === "closed"
              ? "tag-status-closed"
              : "");
          statusTag.textContent = c.status || "Status";

          const associateTag = document.createElement("span");
          associateTag.className = "tag tag-associate";
          associateTag.textContent = c.associateName || "Associate";

          metaRight.appendChild(tierTag);
          metaRight.appendChild(statusTag);
          metaRight.appendChild(associateTag);

          header.appendChild(metaLeft);
          header.appendChild(metaRight);

          /* ——— TITLE ——— */
          const titleEl = document.createElement("div");
          titleEl.className = "post-title";
          titleEl.textContent = c.title || "(Untitled case)";

          /* ——— DESCRIPTION ——— */
          const descEl = document.createElement("div");
          descEl.className = "post-description collapsed";
          descEl.textContent = c.description || "";

          const readMore = document.createElement("button");
          readMore.type = "button";
          readMore.className = "read-more";
          readMore.textContent = "Read more";
          readMore.addEventListener("click", () => {
            const isCollapsed = descEl.classList.contains("collapsed");
            if (isCollapsed) {
              descEl.classList.remove("collapsed");
              readMore.textContent = "Show less";
            } else {
              descEl.classList.add("collapsed");
              readMore.textContent = "Read more";
            }
          });

          /* ——— FOOTER ——— */
          const footer = document.createElement("div");
          footer.className = "post-footer";

          const engagementBar = document.createElement("div");
          engagementBar.className = "engagement-bar";

          const upvoteBtn = document.createElement("button");
          upvoteBtn.type = "button";
          upvoteBtn.className = "engagement-button";
          upvoteBtn.innerHTML = `👍`;
          upvoteBtn.addEventListener("click", () => {
            console.log("Upvote case", c.id);
          });

          const downvoteBtn = document.createElement("button");
          downvoteBtn.type = "button";
          downvoteBtn.className = "engagement-button";
          downvoteBtn.innerHTML = `👎`;
          downvoteBtn.addEventListener("click", () => {
            console.log("Downvote case", c.id);
          });

          const commentsBtn = document.createElement("button");
          commentsBtn.type = "button";
          commentsBtn.className = "engagement-button";
          commentsBtn.innerHTML = `💬`;
          commentsBtn.addEventListener("click", () => {
            console.log("Open comments for case", c.id);
          });

          const rateBtn = document.createElement("button");
          rateBtn.type = "button";
          rateBtn.className = "engagement-button";
          rateBtn.innerHTML = `⭐ Rate`;
          rateBtn.addEventListener("click", () => {
            console.log("Rate case", c.id);
          });

          const viewLink = document.createElement("button");
          viewLink.type = "button";
          viewLink.className = "view-link";
          viewLink.innerHTML = `View case →`;
          viewLink.addEventListener("click", () => {
            console.log("View case", c.id);
          });

          engagementBar.appendChild(upvoteBtn);
          engagementBar.appendChild(downvoteBtn);
          engagementBar.appendChild(commentsBtn);
          engagementBar.appendChild(rateBtn);
          engagementBar.appendChild(viewLink);

          footer.appendChild(engagementBar);

          main.appendChild(header);
          main.appendChild(titleEl);
          main.appendChild(descEl);
          if ((c.description || "").length > 140) {
            main.appendChild(readMore);
          }
          main.appendChild(footer);

          post.appendChild(avatarWrapper);
          post.appendChild(main);

          casesFeed.appendChild(post);
        });
      }

      /****************************************************
       * SIDEBAR BUILDERS
       ****************************************************/
      function buildSidebar(cases) {
        buildTrendingCases(cases);
        buildTopAssociates(cases);
      }

      function buildTrendingCases(cases) {
        trendingCasesEl.innerHTML = "";

        if (!cases.length) {
          trendingCasesEl.innerHTML = `
            <div class="sidebar-small-text">
              No cases available yet.
            </div>
          `;
          return;
        }

        const sorted = [...cases].sort((a, b) => {
          const aScore = (a.upvotes || 0) + (a.commentsCount || 0);
          const bScore = (b.upvotes || 0) + (b.commentsCount || 0);
          return bScore - aScore;
        });

        const top = sorted.slice(0, 5);

        top.forEach(c => {
          const item = document.createElement("div");
          item.className = "sidebar-item";
          item.addEventListener("click", () => console.log("View case", c.id));

          const main = document.createElement("div");
          main.className = "sidebar-item-main";

          const title = document.createElement("div");
          title.className = "sidebar-item-title";
          title.textContent = c.title || "(Untitled case)";

          const meta = document.createElement("div");
          meta.className = "sidebar-item-meta";
          meta.textContent = `${c.associateName || "Associate"} • ${c.upvotes || 0} upvotes • ${c.commentsCount || 0} comments`;

          main.appendChild(title);
          main.appendChild(meta);

          const badge = document.createElement("div");
          badge.className = "sidebar-item-badge";
          badge.textContent = c.tier || "";

          item.appendChild(main);
          item.appendChild(badge);

          trendingCasesEl.appendChild(item);
        });
      }

      function buildTopAssociates(cases) {
        topAssociatesEl.innerHTML = "";

        if (!cases.length) {
          topAssociatesEl.innerHTML = `
            <div class="sidebar-small-text">
              No associates available yet.
            </div>
          `;
          return;
        }

        const map = new Map();
        cases.forEach(c => {
          const name = c.associateName || "Unknown";
          if (!map.has(name)) {
            map.set(name, {
              name,
              cases: 0,
              totalRating: 0,
              ratingCount: 0,
              upvotes: 0
            });
          }
          const entry = map.get(name);
          entry.cases += 1;
          entry.upvotes += c.upvotes || 0;
          if (typeof c.rating === "number") {
            entry.totalRating += c.rating;
            entry.ratingCount += 1;
          }
        });

        const list = Array.from(map.values()).map(e => {
          const avgRating = e.ratingCount ? e.totalRating / e.ratingCount : null;
          return { ...e, avgRating };
        });

        list.sort((a, b) => {
          const aScore = (a.avgRating || 0) * 2 + a.upvotes;
          const bScore = (b.avgRating || 0) * 2 + b.upvotes;
          return bScore - aScore;
        });

        const top = list.slice(0, 5);

        top.forEach((a, index) => {
          const item = document.createElement("div");
          item.className = "sidebar-item";

          const main = document.createElement("div");
          main.className = "sidebar-item-main";

          const title = document.createElement("div");
          title.className = "sidebar-item-title";
          title.textContent = `${index + 1}. ${a.name}`;

          const meta = document.createElement("div");
          meta.className = "sidebar-item-meta";
          const ratingText = a.avgRating ? `${a.avgRating.toFixed(1)}★` : "No rating yet";
          meta.textContent = `${ratingText} • ${a.cases} cases • ${a.upvotes} upvotes`;

          main.appendChild(title);
          main.appendChild(meta);

          const badge = document.createElement("div");
          badge.className = "sidebar-item-badge";
          badge.textContent = "Rank " + (index + 1);

          item.appendChild(main);
          item.appendChild(badge);

          topAssociatesEl.appendChild(item);
        });
      }

      /****************************************************
       * AUTO-LOAD CASES
       ****************************************************/
      window.addEventListener("DOMContentLoaded", loadCases);
    </script>
  </div>
</body>
</html>
