<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Hansen - Cases</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; }
    .neon-green { color: #00ff9d; text-shadow: 0 0 4px #00ff9d; }
    .post-card {
      transition: all 0.2s ease;
    }
    .post-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(0, 255, 157, 0.1);
      border-color: #00ff9d;
    }
    .compact-card { padding: 14px 18px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen pb-12">

  <div class="max-w-4xl mx-auto px-4 pt-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 border-b border-zinc-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white">Mr Hansen</h1>
        <p class="text-emerald-400 text-sm">Live Cases</p>
      </div>
      <a href="#" onclick="goHome()" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300 text-sm font-medium">
        <span class="text-lg">←</span> Back To Home
      </a>
    </div>

    <!-- Category Toggles -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button onclick="filterCategory(this)" class="category-pill active px-5 py-2 rounded-full bg-emerald-500 text-black font-medium">Latest</button>
      <button onclick="filterCategory(this)" class="category-pill px-5 py-2 rounded-full bg-zinc-800 hover:bg-zinc-700">Level 1</button>
      <button onclick="filterCategory(this)" class="category-pill px-5 py-2 rounded-full bg-zinc-800 hover:bg-zinc-700">Level 2</button>
      <button onclick="filterCategory(this)" class="category-pill px-5 py-2 rounded-full bg-zinc-800 hover:bg-zinc-700">Level 3</button>
    </div>

    <!-- Live Cases -->
    <div class="space-y-3" id="posts-container"></div>
  </div>

  <!-- Expanded Case Modal -->
  <div id="post-modal" class="hidden fixed inset-0 bg-black/90 flex items-start justify-center pt-12 z-50 overflow-auto">
    <div class="modal bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-3xl mx-4 mb-12 flex flex-col max-h-[88vh]">
      <div class="p-5 border-b border-zinc-700 flex items-start justify-between sticky top-0 bg-zinc-900 z-10">
        <div>
          <h2 id="modal-title" class="text-2xl font-bold"></h2>
          <p id="modal-meta" class="text-zinc-400 text-sm mt-1"></p>
        </div>
        <button onclick="closeModal()" class="text-3xl text-zinc-400 hover:text-white">×</button>
      </div>
      <div class="flex-1 p-6 overflow-auto" id="modal-body"></div>
      <div class="p-4 border-t border-zinc-700 bg-zinc-950 flex gap-3">
        <button class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-black font-medium py-3 rounded-2xl">Reply / Add Note</button>
        <button onclick="closeModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-3 rounded-2xl">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Your Live Cases from Sheets
    const liveCases = [
      {
        title: "I need to lose some weight",
        meta: "Daisy Malibu — 5/19/2026 16:47 — Level 3 - Crisis Session",
        comments: 12,
        associate: "Daisy Malibu",
        likes: 8,
        dislikes: 1,
        description: "I can't stop eating. You put a cake in front of me and I'm going to finish it. What can I do? I don't have the willpower."
      },
      {
        title: "How do I get a passport",
        meta: "Mark Davies — 5/19/2026 17:12 — Level 1 - Quick Read",
        comments: 5,
        associate: "Mark Davies",
        likes: 3,
        dislikes: 0,
        description: "It's worth a few bucks to get the correct path to getting a passport. Can you assist me?"
      },
      {
        title: "I need makeup help",
        meta: "Poppy Smart — 5/20/2026 16:27 — Level 1 - Quick Read",
        comments: 18,
        associate: "Poppy Smart",
        likes: 14,
        dislikes: 0,
        description: "My mother never let me wear makeup and I have a new boyfriend. I wanted to surprise him with having makeup on."
      },
      {
        title: "Hiking from Mexico to Canada",
        meta: "Molly Hemingway — 5/20/2026 16:52 — Level 3 - Crisis Session",
        comments: 22,
        associate: "Molly H",
        likes: 11,
        dislikes: 2,
        description: "I'm going to be hiking from Mexico to Canada and need help choosing my route. Pacific Crest Trail?"
      },
      {
        title: "Can I feed my dog pizza?",
        meta: "Meagen Taylor — 5/20/2026 18:20 — Level 1 - Quick Read",
        comments: 9,
        associate: "Taylor",
        likes: 7,
        dislikes: 1,
        description: "All my life people have said, never feed your dog pizza. I don't see what the big deal is."
      },
      // ... (I included the first few - you can keep adding from your list)
      {
        title: "Cheese Importation",
        meta: "Lewis Mazella — 5/21/2026 18:42 — Level 3 - Crisis Session",
        comments: 15,
        associate: "Mazella",
        likes: 6,
        dislikes: 0,
        description: "I import cheese from South America... need a new source due to tariffs."
      },
      {
        title: "My Ex says she's pregnant with my baby",
        meta: "Johnathon Spencer — 5/21/2026 19:22 — Level 1 - Quick Read",
        comments: 31,
        associate: "Spencer",
        likes: 12,
        dislikes: 3,
        description: "The months line up. But she's with a new guy now..."
      }
      // Add the rest of your cases here following the same format
    ];

    function renderPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      liveCases.forEach(post => {
        const div = document.createElement('div');
        div.className = `post-card clickable compact-card bg-zinc-900 border border-zinc-800 rounded-2xl flex gap-5 hover:border-emerald-500`;
        div.onclick = () => openPostModal(post);

        div.innerHTML = `
          <div class="flex-1">
            <h2 class="text-base font-bold mt-1 leading-tight">${post.title}</h2>
            <p class="text-zinc-400 text-xs mt-1">${post.meta}</p>
            <div class="flex gap-4 mt-3 text-xs text-zinc-400">
              <span onclick="event.stopImmediatePropagation(); likePost()" class="flex items-center gap-1 hover:text-emerald-400 cursor-pointer">
                <i class="fa-solid fa-thumbs-up"></i> ${post.likes}
              </span>
              <span onclick="event.stopImmediatePropagation(); dislikePost()" class="flex items-center gap-1 hover:text-red-400 cursor-pointer">
                <i class="fa-solid fa-thumbs-down"></i> ${post.dislikes}
              </span>
            </div>
          </div>
          <div class="flex flex-col items-end justify-center min-w-[110px] text-right border-l border-zinc-700 pl-5">
            <div class="text-[10px] uppercase tracking-widest text-zinc-500 mb-0.5">Comments</div>
            <div class="neon-green text-4xl font-bold leading-none">${post.comments}</div>
            <div class="text-emerald-400 text-xs mt-1">Associate: <span class="font-medium">${post.associate}</span></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function openPostModal(post) {
      document.getElementById('modal-title').textContent = post.title;
      document.getElementById('modal-meta').textContent = post.meta;

      document.getElementById('modal-body').innerHTML = `
        <div class="prose prose-invert text-zinc-300">
          <p class="text-lg">${post.description}</p>
          <p class="mt-8 text-sm text-emerald-400">• This case is currently <strong>${post.meta.includes('Pending') ? 'Pending' : 'In Progress'}</strong></p>
        </div>
      `;

      document.getElementById('post-modal').classList.remove('hidden');
      document.getElementById('post-modal').classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('post-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function filterCategory(btn) {
      document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function likePost() { event.stopImmediatePropagation(); alert("👍 Liked"); }
    function dislikePost() { event.stopImmediatePropagation(); alert("👎 Disliked"); }
    function goHome() { alert("Back to Mr Hansen Home"); }

    // Initialize
    window.onload = renderPosts;
  </script>
</body>
</html>
