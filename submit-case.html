<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Case — MR. HANSEN FIRM</title>
  <style>
    body {
      font-family: "Courier New", monospace;
      background: #000;
      color: #00ff88;
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
      line-height: 1.5;
    }
    h1 { text-shadow: 0 0 15px #00ff88; }
    .error { color: #ff6666; }
    .success { color: #00ff88; }
    .panel {
      background: #0a0a0a;
      border: 1px solid #00ff88;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    label { display: block; margin-top: 15px; }
    .required { color: #ff6666; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #00ff88;
      color: #00ff88;
      margin-top: 6px;
    }
    textarea { min-height: 120px; }
    .addon-row {
      display: flex; justify-content: space-between; padding: 12px;
      background: #111; border: 1px solid #00ff88; margin-bottom: 10px; cursor: pointer;
    }
    .addon-row.active { background: #003300; border-color: #00ff88; }
    .submit-button {
      width: 100%; padding: 18px; background: #00ff88; color: #000;
      font-weight: bold; font-size: 18px; border: none; cursor: pointer; margin-top: 20px;
    }
    .loading-spinner {
      display: none; width: 20px; height: 20px;
      border: 3px solid #000; border-top: 3px solid #00ff88;
      border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>SUBMIT CASE</h1>
<p class="subtitle">An account will be created so you can track updates.</p>

<div class="panel">
  <h2>Selected Associate</h2>
  <div id="associateInfo">Loading...</div>
  <small style="color:#666;">Debug: ID = <span id="debugId"></span></small>
</div>

<!-- Your Information, Tier, Case Details, Boosts panels remain the same -->
<!-- (I kept them short here for clarity - they are identical to previous version) -->

<div class="panel">
  <label>Your Full Name <span class="required">*</span></label>
  <input type="text" id="clientName" />

  <label>Display Name (Public) <span class="required">*</span></label>
  <input type="text" id="clientDisplayName" />

  <label>Your Email <span class="required">*</span></label>
  <input type="email" id="clientEmail" />

  <label>Create Password <span class="required">*</span></label>
  <input type="password" id="clientPassword" name="new_password_987" autocomplete="new-password" />

  <label>Phone (optional)</label>
  <input type="tel" id="clientPhone" />
</div>

<div class="panel">
  <label>Select Tier <span class="required">*</span></label>
  <select id="tier">
    <option value="">— Select Tier —</option>
    <option value="Level 1 - Quick Read" data-price="35">Level 1 — Quick Read ($35)</option>
    <option value="Level 2 - Deep Dive Analysis" data-price="95">Level 2 — Deep Dive Analysis ($95)</option>
    <option value="Level 3 - Crisis Session" data-price="195">Level 3 — Crisis Session ($195)</option>
  </select>
</div>

<div class="panel">
  <label>Case Title <span class="required">*</span></label>
  <input type="text" id="caseTitle" />

  <label>Describe Your Situation <span class="required">*</span></label>
  <textarea id="caseDescription"></textarea>
</div>

<div class="panel">
  <h3>Boost Your Case (Optional)</h3>
  <div id="addonsList">
    <div class="addon-row" data-price="45">Featured at the top for 1 week <span style="color:#00ff88">+$45</span></div>
    <div class="addon-row" data-price="30">Boost Client Rating by 2 points <span style="color:#00ff88">+$30</span></div>
    <div class="addon-row" data-price="25">Priority Response <span style="color:#00ff88">+$25</span></div>
  </div>
</div>

<div class="panel">
  <h3>Summary</h3>
  <div><strong>Associate:</strong> <span id="summaryAssociate">—</span></div>
  <div><strong>Tier:</strong> <span id="summaryTier">—</span></div>
  <div><strong>Total:</strong> $<span id="summaryTotal">0</span></div>

  <button id="submitButton" class="submit-button" disabled>SUBMIT CASE &amp; PAY NOW</button>
</div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbwMPK8PCo5IgaeObx3Q8vD4dzqz3EQyLQyrS7Bru6Kx1K_DI6uaxIOfFrOx4OCGzDz0/exec";
let selectedAssociate = null;
let addonTotal = 0;

const urlParams = new URLSearchParams(window.location.search);
const associateId = urlParams.get('id');

document.getElementById("debugId").textContent = associateId || "NONE";

async function loadAssociate() {
  const infoDiv = document.getElementById("associateInfo");
  
  if (!associateId) {
    infoDiv.innerHTML = `<span class="error">No associate ID found in URL.<br>Use: submit-case.html?id=assoc_xxxxxxxx</span>`;
    return;
  }

  infoDiv.innerHTML = "Loading associate...";

  try {
    const res = await fetch(BASE_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "getAssociateProfile", associateId: associateId })
    });

    const data = await res.json();
    console.log("Backend response:", data);   // For debugging

    if (data.success && data.profile) {
      selectedAssociate = data.profile;
      infoDiv.innerHTML = `<span class="success">✓ ${selectedAssociate.name}</span>`;
      document.getElementById("summaryAssociate").textContent = selectedAssociate.name;
      updateSummary();
    } else {
      infoDiv.innerHTML = `<span class="error">Associate not found.<br>ID tried: ${associateId}</span>`;
    }
  } catch (e) {
    infoDiv.innerHTML = `<span class="error">Network error. Check console.</span>`;
    console.error(e);
  }
}

// Add the rest of your functions (updateSummary, addon clicks, submit handler) here...
// (They are the same as the previous version I gave you)

loadAssociate();
</script>
</body>
</html>
