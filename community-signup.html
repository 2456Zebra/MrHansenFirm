<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Signup – MR. HANSEN FIRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: "Consolas", "Courier New", monospace;
      background: #000;
      color: #00ff88;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow-y: auto;
      padding: 40px 0;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        rgba(0, 255, 136, 0.05) 0px,
        rgba(0, 255, 136, 0.05) 2px,
        transparent 2px,
        transparent 4px
      );
      z-index: 999;
    }
    .shell {
      background: #0a0a0a;
      border: 1px solid #00ff88;
      border-radius: 10px;
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #00ff88;
      text-shadow: 0 0 6px #00ff88;
    }
    .subtitle {
      font-size: 14px;
      color: #00ff88;
      opacity: 0.85;
      margin-bottom: 24px;
      line-height: 1.4;
      text-shadow: none;
    }
    label {
      display: block;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #00ff88;
      margin-bottom: 5px;
      font-weight: bold;
      text-shadow: 0 0 6px #00ff88;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #000;
      border: 1px solid #00ff88;
      border-radius: 6px;
      padding: 10px 12px;
      color: #00ff88;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.2) inset;
      text-shadow: none;
    }
    input:focus, textarea:focus {
      border-color: #00ffaa;
      box-shadow: 0 0 18px #00ff88;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    #preview {
      margin-top: 8px;
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #00ff88;
      box-shadow: 0 0 12px #00ff88;
      display: none;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row > div {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: none;
      background: #00ff88;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px #00ff88;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: #00ffaa;
      box-shadow: 0 0 25px #00ffaa;
      transform: scale(1.02);
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .status {
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      white-space: pre-line;
      text-shadow: none;
    }
    .success { color: #00ff88; }
    .error { color: #ff3366; }
    .nav {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
      color: #00ff88;
      opacity: 0.9;
      text-shadow: none;
    }
    .nav a {
      color: #00eaff;
      font-weight: bold;
      text-decoration: none;
      text-shadow: 0 0 6px #00eaff;
    }
    .nav a:hover {
      text-shadow: 0 0 10px #00eaff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>COMMUNITY ACCESS</h1>
    <div class="subtitle">
      Create a public profile to join discussions, comment, and access your community dashboard.
    </div>
    <form id="communityForm">
      <label for="displayName">Display Name</label>
      <input type="text" id="displayName" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Create Password</label>
      <input type="password" id="password" minlength="6" required>
      <label for="bio">Short Bio</label>
      <textarea id="bio" required></textarea>
      <div class="row">
        <div>
          <label for="instagram">Instagram (optional)</label>
          <input type="text" id="instagram" placeholder="@username">
        </div>
        <div>
          <label for="photo">Avatar</label>
          <input type="file" id="photo" accept="image/*" required>
          <img id="preview" alt="Preview">
        </div>
      </div>
      <button type="submit" id="submitBtn">CREATE COMMUNITY ACCESS</button>
    </form>
    <div class="status" id="status"></div>
    <div class="nav">
      Already have an account? <a href="login.html">Log in</a><br>
      <a href="/index.html" style="margin-top:8px;display:inline-block;">← Back to Home</a>
    </div>
  </div>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

    let photoBase64 = null;

    function cleanInstagramHandle(input) {
      if (!input) return "";
      return input.trim()
        .replace(/^@/, "")
        .replace(/https?:\/\/(www\.)?instagram\.com\//, "")
        .replace(/\/$/, "")
        .replace(/\s+/g, "");
    }

    // Photo preview
    document.getElementById("photo").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        setStatus("Image too large. Max 5MB.", "error");
        return;
      }

      const preview = document.getElementById("preview");
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";

      const reader = new FileReader();
      reader.onload = () => photoBase64 = reader.result;
      reader.readAsDataURL(file);
    });

    function setStatus(msg, type = "default") {
      const statusEl = document.getElementById("status");
      statusEl.textContent = msg;
      if (type === "success") statusEl.style.color = "#00ff88";
      else if (type === "error") statusEl.style.color = "#ff3366";
      else statusEl.style.color = "#00ff88";
    }

    document.getElementById("communityForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const displayName = document.getElementById("displayName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const bio = document.getElementById("bio").value.trim();
      const instagram = cleanInstagramHandle(document.getElementById("instagram").value);

      if (!displayName || !email || !password || !bio || !photoBase64) {
        setStatus("Please fill all required fields.", "error");
        return;
      }
      if (password.length < 6) {
        setStatus("Password must be at least 6 characters.", "error");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      setStatus("CREATING COMMUNITY PROFILE...");

      const payload = {
        action: "communitySignup",
        name: displayName,
        email: email,
        password: password,
        bio: bio,
        instagram: instagram || "",
        photoBase64: photoBase64
      };

      try {
        const res = await fetch(BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        if (!res.ok) {
          throw new Error(`Server responded with status ${res.status}`);
        }

        const data = await res.json();

        if (!data.success) {
          setStatus("Error: " + (data.error || "Unknown error"), "error");
          btn.disabled = false;
          return;
        }

        setStatus("✅ Profile created successfully! Redirecting...", "success");

        setTimeout(() => {
          const id = data.communityId || "";
          window.location.href = id 
            ? `/community-admin.html?id=${encodeURIComponent(id)}` 
            : "/community-admin.html";
        }, 1200);

      } catch (err) {
        console.error(err);
        setStatus("Connection error. Please try again.", "error");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
