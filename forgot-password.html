<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Hansen Firm - Forgot Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f0f;
            color: #ddd;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .forgot-container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            color: #fff; 
        }

        p {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label { 
            display: block; 
            margin: 15px 0 6px; 
            color: #ccc; 
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #00ff88;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .error-message {
            color: #ff6666;
            font-size: 0.9em;
            margin-top: 4px;
            min-height: 20px;
        }

        .success-message {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin: 15px 0;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) { 
            background: #33ffaa; 
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link { 
            text-align: center; 
            margin-top: 25px; 
        }
        
        .back-link a { 
            color: #888; 
            text-decoration: none; 
        }
        .back-link a:hover { color: #ddd; }
    </style>
</head>
<body>
    <div class="forgot-container">
        <h2>Forgot Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
      
        <form id="forgotForm">
            <label for="email">Email Address</label>
            <div class="input-group">
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div id="emailError" class="error-message"></div>

            <div id="successMessage" class="success-message"></div>
            <div id="generalError" class="error-message"></div>

            <button type="submit" id="submitButton">
                Send Reset Link
            </button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

function showError(fieldId, message) {
    const errorDiv = document.getElementById(fieldId + 'Error');
    if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    }
}

function showGeneralError(message) {
    const errorDiv = document.getElementById('generalError');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
}

function showSuccess(message) {
    const successDiv = document.getElementById('successMessage');
    successDiv.textContent = message;
    successDiv.style.display = 'block';
}

function clearMessages() {
    document.querySelectorAll('.error-message').forEach(el => {
        el.style.display = 'none';
        el.textContent = '';
    });
    document.getElementById('successMessage').style.display = 'none';
}

function setLoading(isLoading) {
    const button = document.getElementById('submitButton');
    if (isLoading) {
        button.disabled = true;
        button.innerHTML = `<span class="spinner"></span> Sending...`;
    } else {
        button.disabled = false;
        button.textContent = 'Send Reset Link';
    }
}

async function sendResetLink(email) {
    try {
        const formData = new FormData();
        formData.append("action", "forgotPassword");   // ← Make sure your Google Script supports this action
        formData.append("email", email);

        const res = await fetch(BASE_URL, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.success) {
            showSuccess("✅ Reset link has been sent to your email. Please check your inbox (and spam folder).");
            document.getElementById('email').value = '';
        } else {
            showGeneralError(data.error || "Failed to send reset link.");
        }
    } catch (err) {
        console.error(err);
        showGeneralError("Connection error. Please try again.");
    }
}

// Form submit
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearMessages();

    const email = document.getElementById('email').value.trim();

    if (!email) {
        return showError('email', 'Please enter your email address');
    }

    setLoading(true);
    await sendResetLink(email);
    setLoading(false);
});
</script>
</body>
</html>
