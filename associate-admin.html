<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Associate Admin • MR. HANSEN FIRM</title>
  <style>
    :root {
      --green: #00ff88;
      --dark: #0a0a0a;
      --gray: #1a1a1a;
      --border: #222;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #ddd;
      min-height: 100vh;
    }
    .header {
      background: var(--dark);
      padding: 18px 40px;
      border-bottom: 2px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { color: var(--green); font-size: 24px; font-weight: bold; }
    .container { display: flex; min-height: calc(100vh - 68px); }
    
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--dark);
      padding: 25px 15px;
      border-right: 1px solid var(--border);
    }
    .nav-item {
      display: block;
      padding: 14px 18px;
      color: #ccc;
      text-decoration: none;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .nav-item:hover, .nav-item.active {
      background: #111;
      color: var(--green);
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .panel {
      background: var(--gray);
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 25px;
    }
    .panel-title {
      color: var(--green);
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .metric-tile {
      background: #111;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .metric-value {
      font-size: 28px;
      color: var(--green);
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th { background: #0a0a0a; color: var(--green); }

    .case-card {
      background: #111;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-left: 6px;
    }

    .small-btn {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .small-btn:hover {
      background: var(--green);
      color: #000;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background: #111;
      border: 2px solid var(--green);
      padding: 25px;
      width: 90%;
      max-width: 920px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">MR. HANSEN FIRM • ASSOCIATE ADMIN</div>
    <div style="color:#666; font-size:14px;">
      <a href="firm-admin.html" style="color:var(--green); text-decoration:none;">← Back to Firm Admin</a>
    </div>
  </div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-item active" onclick="setActiveNav(this); showPanel('dashboard')">📊 Dashboard</div>
      <div class="nav-item" onclick="setActiveNav(this); showPanel('cases')">🛡 My Cases</div>
      <div class="nav-item" onclick="setActiveNav(this); showPanel('messages')">🔐 Messages</div>
      <div class="nav-item" onclick="setActiveNav(this); showPanel('profile')">👤 Profile</div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <!-- Dashboard -->
      <div id="panel-dashboard" class="panel">
        <div class="panel-title">Operational Overview</div>
        <div class="metric-row">
          <div class="metric-tile"><div class="metric-value" id="metricAssigned">0</div><div>Assigned Cases</div></div>
          <div class="metric-tile"><div class="metric-value" id="metricHighRisk">0</div><div>High Risk</div></div>
          <div class="metric-tile"><div class="metric-value" id="metricOverdue">0</div><div>Overdue</div></div>
          <div class="metric-tile"><div class="metric-value" id="metricUnread">0</div><div>Unread Messages</div></div>
        </div>
        <h3 style="color:var(--green); margin:20px 0 10px;">High Risk & Overdue</h3>
        <div id="riskCases"></div>
      </div>

      <!-- Cases -->
      <div id="panel-cases" class="panel" style="display:none;">
        <div class="panel-title">My Cases</div>
        <div style="margin-bottom:12px;">
          <button class="small-btn" onclick="filterCases('all')">All</button>
          <button class="small-btn" onclick="filterCases('open')">Open</button>
          <button class="small-btn" onclick="filterCases('review')">Review</button>
          <button class="small-btn" onclick="filterCases('completed')">Completed</button>
        </div>
        <div id="caseList"></div>
      </div>

      <!-- Messages -->
      <div id="panel-messages" class="panel" style="display:none;">
        <div class="panel-title">Messages</div>
        <select id="msgFilter" onchange="renderMessages()" style="width:100%; padding:8px; background:#0a0a0a; border:1px solid var(--border); color:#ddd;">
          <option value="all">All Cases</option>
        </select>
        <div id="messageList" style="margin-top:15px; max-height:420px; overflow-y:auto;"></div>
      </div>

      <!-- Profile -->
      <div id="panel-profile" class="panel" style="display:none;">
        <div class="panel-title">Associate Profile</div>
        <div id="profileInfo"></div>
      </div>
    </div>
  </div>

  <!-- Case Modal -->
  <div id="caseModal" class="modal">
    <div class="modal-content">
      <h2 style="color:var(--green);">Case Details</h2>
      <div id="modalContent"></div>
      <br>
      <button class="small-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

<script>
// ==================== DATA & STATE ====================
let associateSelf = { ... }; // Keep your mock data here (same as before)
let associateCases = [ ... ];   // Paste your mock cases

function setActiveNav(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  document.getElementById(`panel-${name}`).style.display = 'block';
  
  if (name === 'dashboard') renderDashboard();
  if (name === 'cases') renderCases();
  if (name === 'messages') renderMessages();
  if (name === 'profile') renderProfile();
}

// Render functions (cleaned & adapted to new style)

function renderCases() { /* ... */ }
function renderMessages() { /* ... */ }
function renderProfile() { /* ... */ }

// Modal functions
function openCaseModal(id) { /* ... your original logic ... */ }
function closeModal() {
  document.getElementById('caseModal').style.display = 'none';
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  showPanel('dashboard');
});
</script>
</body>
</html>
