<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Associate Admin • MR. HANSEN FIRM</title>
  <style>
    :root {
      --green: #00ff88;
      --dark: #0a0a0a;
      --gray: #1a1a1a;
      --border: #222;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #ddd;
      min-height: 100vh;
    }
    .header {
      background: var(--dark);
      padding: 18px 40px;
      border-bottom: 2px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { color: var(--green); font-size: 24px; font-weight: bold; }
    .user-info { color: #888; font-size: 14px; }
    .back-home { color: var(--green); text-decoration: none; font-size: 14px; }
    .container { display: flex; min-height: calc(100vh - 68px); }
    
    .sidebar {
      width: 260px;
      background: var(--dark);
      padding: 25px 15px;
      border-right: 1px solid var(--border);
    }
    .nav-item {
      display: block;
      padding: 14px 18px;
      color: #ccc;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .nav-item:hover, .nav-item.active {
      background: #111;
      color: var(--green);
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .panel {
      background: var(--gray);
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 25px;
    }
    .panel-title {
      color: var(--green);
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .metric-tile {
      background: #111;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .metric-value {
      font-size: 28px;
      color: var(--green);
      font-weight: bold;
    }

    .case-card {
      background: #111;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .new-messages { color: #ff0; font-size: 13px; }

    .small-btn {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin: 4px 4px 4px 0;
    }
    .small-btn:hover { background: var(--green); color: #000; }
    .small-btn.reject { border-color: #ff4444; color: #ff4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">MR. HANSEN FIRM • ASSOCIATE ADMIN</div>
    <div>
      <span class="user-info">Signed in as: <strong id="currentUser">Raven Hale</strong></span>
      &nbsp;&nbsp;&nbsp;
      <a href="index.html" class="back-home">← Back to Home</a>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="nav-item active" onclick="setActiveNav(this); showPanel('dashboard')">📊 Dashboard</div>
      <div class="nav-item" onclick="setActiveNav(this); showPanel('cases')">🛡 My Cases</div>
      <div class="nav-item" onclick="setActiveNav(this); showPanel('revenue')">💰 Revenue</div>
      <div class="nav-item" onclick="setActiveNav(this); showPanel('profile')">👤 Profile</div>
    </div>

    <div class="main">
      <!-- Dashboard -->
      <div id="panel-dashboard" class="panel">
        <div class="panel-title">Operational Overview</div>
        <div class="metric-row">
          <div class="metric-tile"><div class="metric-value" id="metricAssigned">0</div><div>Assigned Cases</div></div>
          <div class="metric-tile"><div class="metric-value" id="metricActive">0</div><div>Active Cases</div></div>
          <div class="metric-tile"><div class="metric-value" id="metricCompleted">0</div><div>Completed</div></div>
          <div class="metric-tile"><div class="metric-value" id="metricUnread">0</div><div>Unread Messages</div></div>
        </div>
      </div>

      <!-- My Cases -->
      <div id="panel-cases" class="panel" style="display:none;">
        <div class="panel-title">My Cases</div>
        <div id="caseList"></div>
      </div>

      <!-- Revenue -->
      <div id="panel-revenue" class="panel" style="display:none;">
        <div class="panel-title">Revenue & Commissions</div>
        <div id="revenueContent">Loading transactions...</div>
      </div>

      <!-- Profile -->
      <div id="panel-profile" class="panel" style="display:none;">
        <div class="panel-title">Profile</div>
        <div id="profileContent">Loading profile...</div>
      </div>
    </div>
  </div>

  <!-- Case Modal -->
  <div id="caseModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; z-index:2000;">
    <div style="background:#111; border:2px solid var(--green); padding:25px; width:90%; max-width:920px; max-height:92vh; overflow-y:auto; border-radius:8px;">
      <h2 style="color:var(--green);">Case #<span id="modalCaseId"></span></h2>
      <div id="modalContent"></div>
      <br>
      <button class="small-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec";

let currentAssociate = {
  id: "A-001",   // Will come from login / URL param in production
  name: "Raven Hale"
};

let myCases = [];
let unreadCount = 0;

// Navigation
function setActiveNav(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  document.getElementById(`panel-${name}`).style.display = 'block';
  
  if (name === 'dashboard') renderDashboard();
  if (name === 'cases') renderMyCases();
  if (name === 'revenue') renderRevenue();
  if (name === 'profile') renderProfile();
}

// Live Data Fetch
async function loadMyData() {
  try {
    const res = await fetch(BASE_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "getMyCases",
        associateId: currentAssociate.id
      })
    });
    const data = await res.json();
    
    myCases = data.cases || [];
    unreadCount = data.unreadMessages || 0;
    
    renderDashboard();
    if (document.getElementById('panel-cases').style.display !== 'none') renderMyCases();
  } catch(e) {
    console.error("Failed to load cases", e);
    // Fallback to mock if needed
  }
}

function renderDashboard() {
  document.getElementById('metricAssigned').textContent = myCases.length;
  document.getElementById('metricActive').textContent = myCases.filter(c => c.status === 'open' || c.status === 'review').length;
  document.getElementById('metricCompleted').textContent = myCases.filter(c => c.status === 'completed').length;
  document.getElementById('metricUnread').textContent = unreadCount;
}

function renderMyCases() {
  const container = document.getElementById('caseList');
  container.innerHTML = myCases.map(c => `
    <div class="case-card">
      <strong>Case #${c.id}</strong> — ${c.title || 'No title'}<br>
      Status: ${c.status} 
      ${c.hasNewMessages ? `<span class="new-messages">● New messages</span>` : ''}
      <div style="margin-top:10px;">
        <button class="small-btn" onclick="acceptCase('${c.id}')">Accept</button>
        <button class="small-btn reject" onclick="rejectCase('${c.id}')">Reject</button>
        <button class="small-btn" onclick="openCaseModal('${c.id}')">View & Reply</button>
        ${c.status === 'open' || c.status === 'review' ? `<button class="small-btn" onclick="markCompleted('${c.id}')">Mark Completed</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function acceptCase(id) {
  await postAction({ action: "updateCaseStatus", caseId: id, status: "accepted", associateId: currentAssociate.id });
  loadMyData();
}

async function rejectCase(id) {
  await postAction({ action: "updateCaseStatus", caseId: id, status: "rejected", associateId: currentAssociate.id });
  loadMyData();
}

async function markCompleted(id) {
  await postAction({ action: "markCaseCompleted", caseId: id, associateId: currentAssociate.id });
  // This should trigger client email + public View Cases update on backend
  loadMyData();
}

function openCaseModal(id) {
  const c = myCases.find(x => x.id === id);
  if (!c) return;
  
  document.getElementById('modalCaseId').textContent = c.id;
  document.getElementById('modalContent').innerHTML = `
    <p><strong>Client:</strong> ${c.clientName || 'N/A'}</p>
    <p><strong>Description:</strong> ${c.description || c.clientStatement || ''}</p>
    <textarea id="replyText" style="width:100%; height:120px; background:#000; color:#ddd; border:1px solid var(--green); padding:8px;" placeholder="Type your answer / update here..."></textarea>
    <br><br>
    <button class="small-btn" onclick="sendReply('${id}')">Send Answer to Client</button>
  `;
  document.getElementById('caseModal').style.display = 'flex';
}

async function sendReply(id) {
  const text = document.getElementById('replyText').value.trim();
  if (!text) return;
  
  await postAction({
    action: "postCaseReply",
    caseId: id,
    associateId: currentAssociate.id,
    reply: text
  });
  
  alert("Answer posted. It will appear in the public case view.");
  closeModal();
  loadMyData();
}

function closeModal() {
  document.getElementById('caseModal').style.display = 'none';
}

async function postAction(payload) {
  try {
    await fetch(BASE_URL, { method: "POST", body: JSON.stringify(payload) });
  } catch(e) { console.error(e); }
}

function renderRevenue() { /* fetch commissions */ }
function renderProfile() { /* ratings etc. */ }

// Init
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('currentUser').textContent = currentAssociate.name;
  loadMyData();           // Live load from sheets
  showPanel('dashboard');
});
</script>
</body>
</html>
