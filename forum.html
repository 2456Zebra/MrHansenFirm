<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case View</title>

<style>
    :root {
        --neon: #00ff9d;
        --bg: #0d0d0d;
        --panel: #111;
        --panel2: #0f0f0f;
        --text: #e6e6e6;
        --text-dim: #ccc;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    /* PULSING LOADING */
    .loading {
        animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
    }

    a.back-link {
        display: inline-block;
        margin: 20px;
        color: var(--neon);
        text-decoration: none;
        font-size: 14px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* TOP BUTTONS MOVED LEFT */
    .top-buttons {
        display: flex;
        justify-content: flex-start;
        gap: 10px;
        padding: 0 20px;
        margin-top: -10px;
        margin-bottom: 10px;
    }

    .top-buttons button {
        background: #111;
        border: 1px solid var(--neon);
        color: var(--neon);
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 4px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* MAIN BOX */
    .case-wrapper {
        width: 90%;
        max-width: 900px;
        margin: 0 auto 40px auto;
        padding: 20px;
        background: var(--panel);
        border: 2px solid var(--neon);
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,255,157,0.2);
    }

    .case-title {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 4px;
        color: var(--neon);
        text-shadow: 0 0 8px var(--neon);
    }

    .case-meta {
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 20px;
    }

    .case-description {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 25px;
        color: var(--text-dim);
    }

    /* ASSOCIATE + RATING SIDE BY SIDE */
    .associate-rating-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .associate-block {
        flex: 1;
        min-width: 200px;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
    }

    .associate-block img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--neon);
        box-shadow: 0 0 10px var(--neon);
    }

    .associate-info .name {
        font-size: 18px;
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .associate-info .hir {
        font-size: 14px;
        color: #aaa;
    }

    /* RATING BOX */
    .rating-section {
        flex: 1;
        min-width: 200px;
        padding: 15px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
    }

    .rating-section label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text-dim);
    }

    .rating-numbers span {
        display: inline-block;
        margin-right: 10px;
        padding: 6px 10px;
        background: #222;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--neon);
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    /* MOBILE FRIENDLY */
    @media (max-width: 600px) {
        .case-title { font-size: 22px; }
        .associate-block img { width: 50px; height: 50px; }
        .rating-numbers span { padding: 4px 8px; }
    }

</style>
</head>

<body>

<a class="back-link" href="view-cases.html">&lt; Back to Cases</a>

<div class="top-buttons">
    <button onclick="window.location='community-signup.html'">Join Community Users</button>
    <button onclick="window.location='associate-signup.html'">Become an Associate</button>
</div>

<div class="case-wrapper">

    <div class="case-title loading" id="caseTitle">Loading...</div>
    <div class="case-meta loading" id="caseMeta">Loading...</div>

    <div class="case-description loading" id="caseDescription">
        Loading...
    </div>

    <div class="associate-rating-row">

        <div class="associate-block">
            <img id="associateImage" src="default.jpg">
            <div class="associate-info">
                <div class="name" id="associateName">Loading...</div>
                <div class="hir" id="associateHIR">HIR: --</div>
            </div>
        </div>

        <div class="rating-section">
            <label>Rate this associate's reply (1–10):</label>
            <div class="rating-numbers" id="ratingNumbers">
                <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
            </div>
        </div>

    </div>

</div>

<script>
/* GET CASE ID */
const urlParams = new URLSearchParams(window.location.search);
const caseId = urlParams.get("id");

/* LOAD CASE FROM EXISTING BACKEND */
fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getPublicCases")
  .then(r => r.json())
  .then(data => {
      const post = data.find(p => p.id == caseId);

      if (!post) {
          document.getElementById("caseTitle").textContent = "Case not found.";
          return;
      }

      /* POPULATE */
      document.getElementById("caseTitle").textContent = post.title;
      document.getElementById("caseMeta").textContent =
          `${post.clientName} • ${post.timestamp} • ${post.tier}`;

      document.getElementById("caseDescription").textContent = post.description;

      document.getElementById("associateName").textContent = post.associateName || "Unknown";
      document.getElementById("associateHIR").textContent = "HIR: " + (post.hir || "--");
      document.getElementById("associateImage").src = post.photo || "default.jpg";

      /* Remove loading animation */
      document.querySelectorAll(".loading").forEach(el => el.classList.remove("loading"));
  });
</script>

</body>
</html>
