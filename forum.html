<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case View</title>

<style>
    :root {
        --neon: #00ff9d;
        --bg: #0d0d0d;
        --panel: #111;
        --panel2: #0f0f0f;
        --text: #e6e6e6;
        --text-dim: #ccc;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    /* PULSING LOADING */
    .loading {
        animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
    }

    a.back-link {
        display: inline-block;
        margin: 20px;
        color: var(--neon);
        text-decoration: none;
        font-size: 14px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* TOP BUTTONS RIGHT-ALIGNED ABOVE BOX */
    .top-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 20px;
        margin-top: -10px;
        margin-bottom: 10px;
    }

    .top-buttons button {
        background: #111;
        border: 1px solid var(--neon);
        color: var(--neon);
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 4px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* MAIN BOX */
    .case-wrapper {
        width: 90%;
        max-width: 900px;
        margin: 0 auto 40px auto;
        padding: 20px;
        background: var(--panel);
        border: 2px solid var(--neon);
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,255,157,0.2);
    }

    .case-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 12px;
        color: var(--neon);
        text-shadow: 0 0 8px var(--neon);
    }

    .case-description {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 12px;
        color: var(--text-dim);
    }

    /* PBH-STYLE META UNDER DESCRIPTION */
    .case-meta {
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 24px;
        font-style: italic;
    }

    /* ASSOCIATE + RATING SIDE BY SIDE */
    .associate-rating-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    .associate-block {
        flex: 1;
        min-width: 220px;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
    }

    .associate-block img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--neon);
        box-shadow: 0 0 10px var(--neon);
    }

    .associate-info .name {
        font-size: 18px;
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .associate-info .hir {
        font-size: 14px;
        color: #aaa;
    }

    /* RATING BOX */
    .rating-section {
        flex: 1;
        min-width: 220px;
        padding: 15px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
    }

    .rating-section label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text-dim);
    }

    .rating-numbers span {
        display: inline-block;
        margin-right: 10px;
        margin-bottom: 6px;
        padding: 6px 10px;
        background: #222;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--neon);
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
        font-size: 14px;
    }

    .rating-numbers span.selected {
        background: var(--neon);
        color: #000;
        text-shadow: none;
    }

    .thumbs {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 10px 0 24px 0;
    }

    .thumbs div {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .thumbs span.count {
        color: var(--neon);
    }

    .comments-section h3 {
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
        margin-bottom: 10px;
    }

    .comment {
        padding: 12px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 12px;
    }

    .comment-author {
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .comment-text {
        margin-top: 6px;
        color: var(--text-dim);
    }

    .add-comment-btn {
        margin-top: 10px;
        background: var(--neon);
        color: #000;
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 10px var(--neon);
    }

    /* MOBILE FRIENDLY */
    @media (max-width: 600px) {
        .case-title { font-size: 22px; }
        .case-description { font-size: 16px; }
        .associate-block img { width: 50px; height: 50px; }
        .rating-numbers span { padding: 4px 8px; font-size: 13px; }
        .top-buttons { justify-content: flex-start; padding: 0 16px; }
        .case-wrapper { padding: 16px; }
    }
</style>
</head>

<body>

<a class="back-link" href="view-cases.html">&lt; Back to Cases</a>

<div class="top-buttons">
    <button onclick="window.location='community-signup.html'">Join Community Users</button>
    <button onclick="window.location='associate-signup.html'">Become an Associate</button>
</div>

<div class="case-wrapper">

    <div class="case-title loading" id="caseTitle">Loading...</div>

    <div class="case-description loading" id="caseDescription">
        Loading...
    </div>

    <!-- PBH-style meta under description -->
    <div class="case-meta loading" id="caseMeta">Loading...</div>

    <div class="associate-rating-row">

        <div class="associate-block">
            <img id="associateImage" src="default.jpg" alt="Associate">
            <div class="associate-info">
                <div class="name" id="associateName">Loading...</div>
                <div class="hir" id="associateHIR">HIR: --</div>
            </div>
        </div>

        <div class="rating-section">
            <label>Rate this associate's reply (1–10):</label>
            <div class="rating-numbers" id="ratingNumbers">
                <span data-score="1">1</span><span data-score="2">2</span><span data-score="3">3</span><span data-score="4">4</span><span data-score="5">5</span>
                <span data-score="6">6</span><span data-score="7">7</span><span data-score="8">8</span><span data-score="9">9</span><span data-score="10">10</span>
            </div>
        </div>

    </div>

    <div class="thumbs">
        <div id="thumbUp">👍 <span class="count" id="upCount">0</span></div>
        <div id="thumbDown">👎 <span class="count" id="downCount">0</span></div>
    </div>

    <div class="comments-section">
        <h3>Comments</h3>
        <div id="commentsList">No comments yet.</div>

        <button class="add-comment-btn" onclick="alert('Comments and ratings backend coming next.')">
            Add Comment
        </button>
    </div>

</div>

<script>
/* GET CASE ID */
const urlParams = new URLSearchParams(window.location.search);
const caseId = urlParams.get("id");

/* LOAD CASE FROM EXISTING BACKEND */
fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getPublicCases")
  .then(r => r.json())
  .then(data => {
      const post = data.find(p => p.id == caseId);

      if (!post) {
          document.getElementById("caseTitle").textContent = "Case not found.";
          document.getElementById("caseDescription").textContent = "";
          document.getElementById("caseMeta").textContent = "";
          return;
      }

      /* POPULATE */
      document.getElementById("caseTitle").textContent = post.title;
      document.getElementById("caseDescription").textContent = post.description;

      // PBH-style meta line
      document.getElementById("caseMeta").textContent =
          `By ${post.clientName || "Client"} on ${post.timestamp || ""} in ${post.tier || ""}.`;

      document.getElementById("associateName").textContent = post.associateName || "Unknown";
      document.getElementById("associateHIR").textContent = "HIR: " + (post.hir || "--");
      document.getElementById("associateImage").src = post.photo || "default.jpg";

      document.getElementById("upCount").textContent = post.likes || 0;
      document.getElementById("downCount").textContent = post.dislikes || 0;

      // Remove loading animation
      document.querySelectorAll(".loading").forEach(el => el.classList.remove("loading"));
  });

/* LOCAL RATING UI (visual only for now) */
document.getElementById("ratingNumbers").addEventListener("click", (e) => {
    if (e.target.tagName !== "SPAN") return;
    document.querySelectorAll("#ratingNumbers span").forEach(s => s.classList.remove("selected"));
    e.target.classList.add("selected");
    // Backend wiring for rating will go here
});
</script>

</body>
</html>
