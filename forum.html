<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case View</title>

<style>
    :root {
        --neon: #00ff9d;
        --bg: #0d0d0d;
        --panel: #111;
        --panel2: #0f0f0f;
        --text: #e6e6e6;
        --text-dim: #ccc;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    a.back-link {
        display: inline-block;
        margin: 20px;
        color: var(--neon);
        text-decoration: none;
        font-size: 14px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* TOP BUTTONS */
    .top-buttons {
        width: 90%;
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: -10px;
        margin-bottom: 10px;
    }

    .top-buttons button {
        background: #111;
        border: 1px solid var(--neon);
        color: var(--neon);
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 13px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* MAIN WRAPPER */
    .case-wrapper {
        width: 90%;
        max-width: 1100px;
        margin: 0 auto 40px auto;
        padding: 20px;
        background: var(--panel);
        border: 2px solid var(--neon);
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,255,157,0.2);
        display: flex;
        gap: 16px; /* tightened */
    }

    /* LEFT COLUMN (labels only) */
    .left-col {
        width: 300px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 18px; /* tightened */
    }

    .label {
        font-size: 12px;
        color: var(--neon);
        letter-spacing: 0.05em;
    }

    /* RIGHT COLUMN (content only) */
    .right-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 18px; /* tightened */
    }

    .case-title {
        font-size: 22px;
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 3px var(--neon);
    }

    .case-description {
        font-size: 16px;
        line-height: 1.45;
        color: var(--text-dim);
    }

    .case-meta {
        font-size: 12px;
        color: #999;
        font-style: italic;
        margin-top: -6px; /* tighten under description */
    }

    /* ASSOCIATE INFO */
    .associate-block {
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 330px;
    }

    .associate-block img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--neon);
        box-shadow: 0 0 8px var(--neon);
    }

    .associate-info .name {
        font-size: 15px;
        font-weight: bold;
        color: var(--neon);
    }

    .associate-info .hir {
        font-size: 12px;
        color: #aaa;
    }

    /* ASSOCIATE REPLY */
    .reply-box {
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        padding: 12px;
    }

    .reply-text {
        font-size: 15px;
        color: var(--text-dim);
        line-height: 1.4;
    }

    /* RATING */
    .rating-numbers span {
        display: inline-block;
        margin-right: 8px;
        margin-bottom: 4px;
        padding: 5px 9px;
        background: #222;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--neon);
        color: var(--neon);
        font-size: 13px;
    }

    .rating-numbers span.selected {
        background: var(--neon);
        color: #000;
    }

    /* THUMBS */
    .thumbs {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .thumbs div {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: var(--neon);
    }

    /* COMMENTS */
    .comments-section h3 {
        color: var(--neon);
        margin-bottom: 6px;
        font-size: 15px;
    }

    .comment {
        padding: 10px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 10px;
    }

    .comment-author {
        font-weight: bold;
        color: var(--neon);
        font-size: 13px;
    }

    .comment-text {
        margin-top: 4px;
        color: var(--text-dim);
        font-size: 14px;
    }

    .add-comment-btn {
        margin-top: 6px;
        background: var(--neon);
        color: #000;
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        box-shadow: 0 0 8px var(--neon);
    }

    /* MOBILE STACKING */
    @media (max-width: 800px) {
        .case-wrapper {
            flex-direction: column;
        }
        .left-col {
            width: 100%;
            gap: 12px;
        }
        .label {
            margin-bottom: -6px;
        }
    }
</style>
</head>

<body>

<a class="back-link" href="view-cases.html">&lt; Back to Cases</a>

<div class="top-buttons">
    <button onclick="window.location='community-signup.html'">Join Community Users</button>
    <button onclick="window.location='associate-signup.html'">Become an Associate</button>
</div>

<div class="case-wrapper">

    <!-- LEFT COLUMN (labels only) -->
    <div class="left-col">
        <div class="label">CASE:</div>
        <div class="label">DETAILS:</div>
        <div class="label">ASSOCIATE ASSIGNED TO CASE:</div>
        <div class="label">ASSOCIATE’S REPLY:</div>
        <div class="label">RATE THIS ASSOCIATE:</div>
        <div class="label">CASE RATING:</div>
        <div class="label">COMMENTS:</div>
    </div>

    <!-- RIGHT COLUMN (content only) -->
    <div class="right-col">

        <!-- CASE TITLE -->
        <div class="case-title" id="caseTitle">Loading...</div>

        <!-- DESCRIPTION -->
        <div class="case-description" id="caseDescription">Loading...</div>

        <!-- META (no label) -->
        <div class="case-meta" id="caseMeta">Loading...</div>

        <!-- ASSOCIATE INFO -->
        <div class="associate-block">
            <img id="associateImage" src="default.jpg">
            <div class="associate-info">
                <div class="name" id="associateName">Loading...</div>
                <div class="hir" id="associateHIR">HIR: --</div>
            </div>
        </div>

        <!-- ASSOCIATE REPLY -->
        <div class="reply-box">
            <div class="reply-text" id="associateReply">
                Associate reply goes here.
            </div>
        </div>

        <!-- RATING -->
        <div class="rating-numbers" id="ratingNumbers">
            <span data-score="1">1</span><span data-score="2">2</span><span data-score="3">3</span><span data-score="4">4</span><span data-score="5">5</span>
            <span data-score="6">6</span><span data-score="7">7</span><span data-score="8">8</span><span data-score="9">9</span><span data-score="10">10</span>
        </div>

        <!-- THUMBS -->
        <div class="thumbs">
            <div id="thumbUp">👍 <span id="upCount">0</span></div>
            <div id="thumbDown">👎 <span id="downCount">0</span></div>
        </div>

        <!-- COMMENTS -->
        <div class="comments-section">
            <h3>COMMENTS</h3>
            <div id="commentsList">No comments yet.</div>

            <button class="add-comment-btn" onclick="alert('Comments backend coming next.')">
                Add Comment
            </button>
        </div>

    </div>

</div>

<script>
/* GET CASE ID */
const urlParams = new URLSearchParams(window.location.search);
const caseId = urlParams.get("id");

/* LOAD CASE FROM EXISTING BACKEND */
fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getPublicCases")
  .then(r => r.json())
  .then(data => {
      const post = data.find(p => p.id == caseId);

      if (!post) {
          document.getElementById("caseTitle").textContent = "Case not found.";
          return;
      }

      /* POPULATE RIGHT COLUMN */
      document.getElementById("caseTitle").textContent = post.title;
      document.getElementById("caseDescription").textContent = post.description;

      document.getElementById("caseMeta").textContent =
          `By ${post.clientName || "Client"} on ${post.timestamp || ""} • ${post.tier || ""}`;

      document.getElementById("associateName").textContent = post.associateName || "Unknown";
      document.getElementById("associateHIR").textContent = "HIR: " + (post.hir || "--");
      document.getElementById("associateImage").src = post.photo || "default.jpg";

      document.getElementById("upCount").textContent = post.likes || 0;
      document.getElementById("downCount").textContent = post.dislikes || 0;
  });

/* LOCAL RATING UI (visual only for now) */
document.getElementById("ratingNumbers").addEventListener("click", (e) => {
    if (e.target.tagName !== "SPAN") return;
    document.querySelectorAll("#ratingNumbers span").forEach(s => s.classList.remove("selected"));
    e.target.classList.add("selected");
});
</script>

</body>
</html>
