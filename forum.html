<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case View</title>

<style>
    :root {
        --neon: #00ff9d;
        --bg: #0d0d0d;
        --panel: #111;
        --panel2: #0f0f0f;
        --text: #e6e6e6;
        --text-dim: #ccc;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    a.back-link {
        display: inline-block;
        margin: 20px;
        color: var(--neon);
        text-decoration: none;
        font-size: 14px;
        text-shadow: 0 0 6px var(--neon);
    }

    .top-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 10px 20px;
    }

    .top-buttons button {
        background: #111;
        border: 1px solid var(--neon);
        color: var(--neon);
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 4px;
        text-shadow: 0 0 6px var(--neon);
    }

    /* MAIN BOX */
    .case-wrapper {
        width: 90%;
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
        background: var(--panel);
        border: 2px solid var(--neon);
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,255,157,0.2);
    }

    .case-title {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 10px;
        color: var(--neon);
        text-shadow: 0 0 8px var(--neon);
    }

    .case-description {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 25px;
        color: var(--text-dim);
    }

    .associate-block {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .associate-block img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--neon);
        box-shadow: 0 0 10px var(--neon);
    }

    .associate-info .name {
        font-size: 18px;
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .associate-info .hir {
        font-size: 14px;
        color: #aaa;
    }

    .rating-section label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text-dim);
    }

    .rating-numbers span {
        display: inline-block;
        margin-right: 10px;
        padding: 6px 10px;
        background: #222;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--neon);
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .thumbs {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 20px 0;
    }

    .thumbs div {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .thumbs span.count {
        color: var(--neon);
    }

    .comments-section h3 {
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .comment {
        padding: 12px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 12px;
    }

    .comment-author {
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .comment-text {
        margin-top: 6px;
        color: var(--text-dim);
    }

    .add-comment-btn {
        margin-top: 20px;
        background: var(--neon);
        color: #000;
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 10px var(--neon);
    }
</style>
</head>

<body>

<a class="back-link" href="view-cases.html">&lt; Back to Cases</a>

<div class="top-buttons">
    <button onclick="window.location='community-signup.html'">Join Community Users</button>
    <button onclick="window.location='associate-signup.html'">Become an Associate</button>
</div>

<div class="case-wrapper">

    <div class="case-title" id="caseTitle">Loading...</div>

    <div class="case-description" id="caseDescription">
        Loading full description...
    </div>

    <div class="associate-block">
        <img id="associateImage" src="default.jpg">
        <div class="associate-info">
            <div class="name" id="associateName">Loading...</div>
            <div class="hir" id="associateHIR">HIR: --</div>
        </div>
    </div>

    <div class="rating-section">
        <label>Rate this associate's reply (1–10):</label>
        <div class="rating-numbers" id="ratingNumbers">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
        </div>
    </div>

    <div class="thumbs">
        <div id="thumbUp">👍 <span class="count" id="upCount">0</span></div>
        <div id="thumbDown">👎 <span class="count" id="downCount">0</span></div>
    </div>

    <div class="comments-section">
        <h3>Comments</h3>
        <div id="commentsList"></div>

        <button class="add-comment-btn" onclick="openCommentBox()">Add Comment</button>
    </div>

</div>

<script>
/* GET CASE ID FROM URL */
const urlParams = new URLSearchParams(window.location.search);
const caseId = urlParams.get("id");

/* LOAD CASE */
fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getCase&id=" + caseId)
  .then(r => r.json())
  .then(data => {
      document.getElementById("caseTitle").textContent = data.title;
      document.getElementById("caseDescription").textContent = data.description;

      loadAssociate(data.associateId);
      loadComments(caseId);
  });

/* LOAD ASSOCIATE */
function loadAssociate(associateId) {
    fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getAssociate&id=" + associateId)
      .then(r => r.json())
      .then(a => {
          document.getElementById("associateName").textContent = a.name;
          document.getElementById("associateHIR").textContent = "HIR: " + a.hir;
          document.getElementById("associateImage").src = a.photo || "default.jpg";
      });
}

/* LOAD COMMENTS */
function loadComments(caseId) {
    fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec?action=getComments&id=" + caseId)
      .then(r => r.json())
      .then(comments => {
          const list = document.getElementById("commentsList");
          list.innerHTML = "";

          comments.forEach(c => {
              list.innerHTML += `
                <div class="comment">
                    <div class="comment-author">${c.author}</div>
                    <div class="comment-text">${c.text}</div>
                </div>
              `;
          });
      });
}

/* ADD COMMENT */
function openCommentBox() {
    const text = prompt("Enter your comment:");
    if (!text) return;

    fetch("https://script.google.com/macros/s/AKfycbyz_Gb33dArNmP5MoSK3Pk4JpkR7i_MAo_gNDzh2tNOOqsY7kgk_IVkoNTZXOQMGu1k/exec", {
        method: "POST",
        body: JSON.stringify({
            action: "addComment",
            caseId: caseId,
            text: text
        })
    }).then(() => loadComments(caseId));
}
</script>

</body>
</html>
