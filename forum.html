<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case View</title>

<style>
    :root {
        --neon: #00ff9d;
        --bg: #0d0d0d;
        --panel: #111;
        --panel2: #0f0f0f;
        --text: #e6e6e6;
        --text-dim: #ccc;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    a.back-link {
        display: inline-block;
        margin: 20px;
        color: var(--neon);
        text-decoration: none;
        font-size: 14px;
        text-shadow: 0 0 6px var(--neon);
    }

    .top-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 10px 20px;
    }

    .top-buttons button {
        background: #111;
        border: 1px solid var(--neon);
        color: var(--neon);
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 4px;
        text-shadow: 0 0 6px var(--neon);
    }

    .case-container {
        width: 90%;
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        background: var(--panel);
        border: 1px solid #222;
        border-radius: 6px;
    }

    .case-title {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 10px;
        color: var(--neon);
        text-shadow: 0 0 8px var(--neon);
    }

    .case-description {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 25px;
        color: var(--text-dim);
    }

    .associate-block {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .associate-block img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--neon);
        box-shadow: 0 0 10px var(--neon);
    }

    .associate-info .name {
        font-size: 18px;
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .associate-info .hir {
        font-size: 14px;
        color: #aaa;
    }

    .rating-section label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text-dim);
    }

    .rating-numbers span {
        display: inline-block;
        margin-right: 10px;
        padding: 6px 10px;
        background: #222;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--neon);
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .thumbs {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 20px 0;
    }

    .thumbs div {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .thumbs span.count {
        color: var(--neon);
    }

    .comments-section h3 {
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .comment {
        padding: 12px;
        background: var(--panel2);
        border: 1px solid #222;
        border-radius: 6px;
        margin-bottom: 12px;
    }

    .comment-author {
        font-weight: bold;
        color: var(--neon);
        text-shadow: 0 0 6px var(--neon);
    }

    .comment-text {
        margin-top: 6px;
        color: var(--text-dim);
    }

    .add-comment-btn {
        margin-top: 20px;
        background: var(--neon);
        color: #000;
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 10px var(--neon);
    }
</style>
</head>

<body>

<a class="back-link" href="view-cases.html">&lt; Back to Cases</a>

<div class="top-buttons">
    <button onclick="window.location='community-signup.html'">Join Community Users</button>
    <button onclick="window.location='associate-signup.html'">Become an Associate</button>
</div>

<div class="case-container">

    <div class="case-title" id="caseTitle">Loading...</div>

    <div class="case-description" id="caseDescription">
        Loading full description...
    </div>

    <div class="associate-block">
        <img id="associateImage" src="default.jpg">
        <div class="associate-info">
            <div class="name" id="associateName">Associate Name</div>
            <div class="hir" id="associateHIR">HIR: --</div>
        </div>
    </div>

    <div class="rating-section">
        <label>Rate this associate's reply (1–10):</label>
        <div class="rating-numbers" id="ratingNumbers">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
        </div>
    </div>

    <div class="thumbs">
        <div id="thumbUp">👍 <span class="count" id="upCount">0</span></div>
        <div id="thumbDown">👎 <span class="count" id="downCount">0</span></div>
    </div>

    <div class="comments-section">
        <h3>Comments</h3>
        <div id="commentsList"></div>

        <button class="add-comment-btn" onclick="openCommentBox()">Add Comment</button>
    </div>

</div>

</body>
</html>
